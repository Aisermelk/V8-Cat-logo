<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catálogo online</title>
  <meta name="description" content="Explore produtos, adicione ao carrinho e faça seu pedido online.">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-row">
      <a class="brand-slot" href="./" aria-label="Página inicial">
        <img src="assets/logo.svg" alt="Logo da loja" onerror="this.hidden=true">
        <span class="brand-fallback" aria-hidden="true"></span>
      </a>
      <div class="header-actions">
        <button class="icon-button" type="button" aria-label="Minha conta" title="Minha conta">♙</button>
        <button class="cart-button" id="openCart" aria-label="Abrir carrinho">🛒<strong id="cartCount">0</strong></button>
      </div>
    </div>
    <div class="container search-wrap"><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar produtos"><button id="searchBtn" aria-label="Buscar">Buscar</button></div></div>
    <nav class="nav" aria-label="Categorias"><div class="container" id="categories"></div></nav>
  </header>

  <main>
    <section class="banners" id="bannersWrap" hidden aria-label="Ofertas em destaque">
      <div class="container">
        <div class="banner-carousel" id="banners"></div>
        <div class="banner-dots" id="bannerDots" aria-label="Selecionar banner"></div>
      </div>
    </section>

    <section class="section" id="produtos">
      <div class="container">
        <div class="section-head"><h2 id="listTitle">Ofertas para você</h2><span id="resultCount"></span></div>
        <div id="products" class="products"><div class="loading">Carregando catálogo...</div></div>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="container footer-row">
    <div><a class="footer-brand" href="./"><img src="assets/logo.svg" alt="Logo da loja" onerror="this.hidden=true"></a><p data-v8="content.description">Informações da loja, políticas e formas de atendimento.</p></div>
    <div><strong>Atendimento</strong><a data-v8="contact.whatsapp" target="_blank" rel="noopener">WhatsApp</a><a data-v8="social.instagram" target="_blank" rel="noopener">Instagram</a></div>
    <div><strong>Informações</strong><a data-v8="content.termsUrl" target="_blank" rel="noopener">Termos e condições</a><a data-v8="content.privacyUrl" target="_blank" rel="noopener">Privacidade</a><small>© <span id="year"></span></small></div>
  </div></footer>

  <a class="whatsapp" data-v8-href="contact.whatsapp" target="_blank" rel="noopener" aria-label="Falar pelo WhatsApp">☎</a>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="cartDrawer" aria-label="Carrinho" hidden>
    <div class="drawer-head"><h2>Seu carrinho</h2><button id="closeCart" aria-label="Fechar">×</button></div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer"><div><span>Total</span><strong id="cartTotal">R$ 0,00</strong></div><button id="checkout" class="btn primary">Continuar pedido</button><p class="note" id="cartNote"></p></div>
  </aside>

  <dialog id="productDialog" class="product-dialog">
    <button class="dialog-close" id="closeProduct" aria-label="Fechar">×</button>
    <div id="productDetail"></div>
  </dialog>

  <!-- Insira o ID do projeto no V8 Admin Universal. O V8 Loader conecta os dados do catálogo. -->
  <script src="js/v8-loader.js" data-project-id="f3834657-9ddf-4798-a47e-2362fefd8814" data-catalog="true" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
