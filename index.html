<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827"><meta name="description" content="Confira nosso catálogo de produtos.">
  <title>Catálogo</title>
  <style>
    :root{--brand:#166534;--brand-ink:#fff;--bg:#f5f6f8;--card:#fff;--ink:#17202a;--muted:#687386;--line:#e7eaf0;--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1160px;margin:auto;padding:0 18px}
    .hero{background:linear-gradient(135deg,#111827,#263548);color:#fff;padding:28px 0 34px}.top{display:flex;align-items:center;gap:14px}.brandmark{width:52px;height:52px;object-fit:cover;border-radius:14px;background:#ffffff20;display:none}.brandname{font-size:clamp(22px,4vw,32px);font-weight:800;letter-spacing:-.5px}.subtitle{color:#d1d8e2;margin:4px 0 0}.hero-note{margin-top:24px;max-width:620px;font-size:clamp(17px,3vw,24px);font-weight:650;line-height:1.3}.tools{display:grid;grid-template-columns:1fr;gap:12px;margin:22px 0 18px}.search{width:100%;border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:#fff;outline:none}.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 8px;scrollbar-width:thin}.chip{border:1px solid var(--line);background:#fff;color:#364152;border-radius:999px;padding:9px 14px;white-space:nowrap}.chip.active{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}.section-title{font-size:20px;margin:14px 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;padding-bottom:36px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0;display:flex;flex-direction:column;box-shadow:0 4px 16px #17202a08}.photo{aspect-ratio:1/1;background:#edf0f3;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:10px;left:10px;border-radius:999px;background:#fff;color:#9b341b;padding:5px 9px;font-size:11px;font-weight:800;box-shadow:0 2px 8px #0001}.body{padding:13px;display:flex;flex:1;flex-direction:column}.name{font-weight:750;font-size:15px;line-height:1.3;margin:0 0 6px}.desc{font-size:13px;color:var(--muted);margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.prices{margin-top:auto;padding-top:3px}.oldprice{color:#8992a1;text-decoration:line-through;font-size:12px}.price{font-size:19px;font-weight:850;letter-spacing:-.3px}.buy{display:block;text-align:center;text-decoration:none;background:var(--brand);color:var(--brand-ink);font-weight:750;padding:11px 10px;border-radius:11px;margin-top:12px}.empty,.loading,.error{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted);grid-column:1/-1}.footer{padding:20px 0 36px;text-align:center;color:var(--muted);font-size:12px}.footer strong{color:var(--ink)}.hide{display:none!important}
    @media(min-width:640px){.tools{grid-template-columns:minmax(220px,360px) 1fr;align-items:center}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.body{padding:16px}.name{font-size:16px}}
    @media(min-width:920px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{padding:36px 0 42px}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap">
    <div class="top"><img id="store-logo" class="brandmark" alt=""><div><div id="store-name" class="brandname">Catálogo</div><p id="store-subtitle" class="subtitle">Conheça nossos produtos</p></div></div>
    <div id="hero-note" class="hero-note">Encontre o que você procura.</div>
  </div></header>
  <main class="wrap">
    <div class="tools"><input id="search" class="search" type="search" placeholder="Buscar produtos..." aria-label="Buscar produtos"><div id="count" class="subtitle" style="color:var(--muted)">Carregando catálogo…</div></div>
    <nav id="categories" class="chips" aria-label="Categorias"></nav>
    <h2 class="section-title">Nossos produtos</h2>
    <section id="products" class="grid" aria-live="polite"><div class="loading">Carregando catálogo…</div></section>
  </main>
  <footer class="footer wrap">Catálogo digital <strong id="footer-name">V8</strong></footer>
  <script src="v8-loader.js" defer></script>
</body></html>
